
<script>
"use strict";

const SERVER_IP = "Kartaviy.aternos.me";
const STATUS_API =
  "https://api.mcstatus.io/v2/status/java/" +
  encodeURIComponent(SERVER_IP) + "?timeout=10&query=false";

const $ = id => document.getElementById(id);
let checking = false;

$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(SERVER_IP);
    $("copyStatus").textContent = "IP скопирован!";
  } catch {
    $("copyStatus").textContent = "IP сервера: " + SERVER_IP;
  }
});

function getPlayerName(player) {
  if (typeof player === "string") return player;

  return player?.name_clean ||
    player?.name_raw ||
    player?.name?.clean ||
    player?.name?.raw ||
    (typeof player?.name === "string" ? player.name : "") ||
    player?.username || "";
}

function renderPlayers(data) {
  const container = $("playersList");
  container.replaceChildren();

  const players = data.players || {};
  const list = Array.isArray(players.list) ? players.list :
    Array.isArray(players.sample) ? players.sample : [];

  const names = list.map(getPlayerName).filter(Boolean);

  if (!names.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = Number(players.online || 0) > 0
      ? "Онлайн есть, но API не передал ники игроков."
      : "Сейчас на сервере никого нет.";
    container.appendChild(empty);
    return;
  }

  names.forEach(name => {
    const item = document.createElement("div");
    item.className = "player";

    const icon = document.createElement("span");
    icon.className = "playericon";
    icon.textContent = "◆";

    const label = document.createElement("span");
    label.textContent = name;

    item.append(icon, label);
    container.appendChild(item);
  });
}

async function updateStatus() {
  if (checking) return;
  checking = true;

  $("statusText").textContent = "Проверяем сервер…";

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    let response;
    try {
      response = await fetch(STATUS_API, {
        cache: "no-store",
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }

    if (!response.ok) {
      throw new Error("API ответил: HTTP " + response.status);
    }

    const data = await response.json();

    if (typeof data.online !== "boolean") {
      throw new Error("API вернул неизвестный ответ");
    }

    const players = data.players || {};
    const online = data.online;

    $("statusDot").className = "dot " + (online ? "online" : "offline");
    $("statusText").textContent = online ? "Сервер онлайн" : "Сервер офлайн";
    $("playerCount").textContent =
      (players.online ?? 0) + " / " + (players.max ?? "?");

    $("versionText").textContent = "Версия: " +
      (data.version?.name_clean ||
       data.version?.name_raw ||
       data.version?.name ||
       "не определена");

    $("updatedText").textContent =
      "Обновлено: " + new Date().toLocaleTimeString("ru-RU");

    renderPlayers(data);
  } catch (error) {
    $("statusText").textContent = "Не удалось получить статус";
    $("updatedText").textContent =
      error.name === "AbortError"
        ? "Превышено время ожидания. Повторим проверку."
        : "Ошибка соединения с API. Повторим проверку.";

    // Не объявляем сервер офлайн только из-за ошибки API.
    $("playersList").replaceChildren();
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent =
      "Статус временно недоступен. Нажми «Обновить» или подожди.";
    $("playersList").appendChild(empty);
  } finally {
    checking = false;
  }
}

$("refreshBtn").addEventListener("click", updateStatus);

updateStatus();
setInterval(updateStatus, 30000);
</script>
